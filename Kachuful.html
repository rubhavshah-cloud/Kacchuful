<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kachuful</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Nunito:wght@500;700;800&display=swap">
<style>
:root{--felt:#1f5a45;--felt2:#17463a;--card:#fbf7ee;--ink:#2a2420;--red:#c0392b;--green:#2e7d4f;--gold:#e8c468;--muted:#d5e6dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--felt:#123a2e;--felt2:#0d2d24;--card:#efe9da}}
:root[data-theme="dark"]{--felt:#123a2e;--felt2:#0d2d24;--card:#efe9da}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--felt2);background-image:radial-gradient(ellipse at top,var(--felt),var(--felt2));background-attachment:fixed;color:#fff;font-family:Nunito,system-ui,sans-serif;font-weight:500}
main{max-width:560px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:"Alfa Slab One",Georgia,serif;font-weight:400;font-size:clamp(2.2rem,9vw,3rem);margin:0;color:var(--gold)}
.sub{margin:6px 0 20px;color:var(--muted);line-height:1.5}
.add{display:flex;gap:10px}
input{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:14px 16px;border-radius:12px;border:2px solid transparent;background:var(--card);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:12px}
.btn{background:var(--gold);color:#3a2a08;padding:14px 20px}
.btn.big{width:100%;margin-top:18px;font-size:1.1rem;padding:16px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.msg{min-height:1.4em;margin:8px 2px 0;color:#ffd6cf;font-size:.95rem}
.bar{margin:16px 0 12px}
.hint{color:var(--muted);font-size:.92rem;line-height:1.45;margin-top:4px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{display:flex;align-items:center;gap:14px;background:var(--card);color:var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.suit{font-size:1.7rem;width:2rem;text-align:center;line-height:1}
.red{color:var(--red)}
.name{flex:1;font-weight:700;font-size:1.1rem;overflow-wrap:anywhere}
.seat{font-size:.85rem;color:#6b5f55}
.x{background:transparent;color:#8a7d72;font-size:1.3rem;padding:4px 10px}
.empty{border:2px dashed rgba(255,255,255,.35);border-radius:14px;padding:26px;text-align:center;color:var(--muted)}
.actions{display:flex;gap:10px;margin-top:16px}
.ghost{flex:1;background:transparent;color:#fff;border:2px solid rgba(255,255,255,.4);padding:12px}
.ghost:disabled{opacity:.35;cursor:not-allowed}
/* game */
.board{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--felt2);margin:-24px -16px 0;padding:12px 16px 10px;box-shadow:0 6px 10px -6px rgba(0,0,0,.5)}
.lbl{font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.brow{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sar{display:flex;align-items:center;gap:8px;background:var(--card);color:var(--ink);border-radius:12px;padding:4px 12px 4px 10px;box-shadow:0 2px 0 rgba(0,0,0,.3)}
.sar i{font-style:normal;font-size:1.9rem;line-height:1}
.sar i.red{color:var(--red)}
.sar span{font-size:.75rem;line-height:1.2;text-align:left;font-weight:800;color:#6b5f55;text-transform:uppercase;letter-spacing:.05em}
.sar span em{display:block;font-style:normal;font-weight:600;text-transform:none;letter-spacing:0}
.chips{display:flex;gap:8px;overflow-x:auto;padding-top:6px}
.chip{flex:1 0 auto;min-width:70px;background:rgba(255,255,255,.12);border-radius:12px;padding:6px 10px;text-align:center}
.chip b{display:block;font-size:1.35rem;line-height:1.2}
.chip span{font-size:.82rem;color:var(--muted);display:block;max-width:92px;margin:0 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip.lead{background:var(--gold);color:#3a2a08}.chip.lead span{color:#5a4410}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:18px}
.rd{font-family:"Alfa Slab One",Georgia,serif;font-size:1.6rem;color:var(--gold);line-height:1.1}
.meta{color:var(--muted);font-size:.95rem;text-align:right;line-height:1.35}
.panel{background:var(--card);color:var(--ink);border-radius:18px;padding:20px 16px;margin-top:12px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.panel h2{margin:0 0 4px;font-size:1.5rem;overflow-wrap:anywhere}
.panel p{margin:0 0 16px;color:#6b5f55;line-height:1.4}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.num{background:#efe6d0;color:var(--ink);font-size:2rem;font-weight:800;height:76px;border:2px solid #3b332d}
.num:active{background:var(--gold)}
.num:disabled{opacity:.25;cursor:not-allowed;text-decoration:line-through}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.res{height:110px;font-size:1.25rem;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.res small{font-weight:600;font-size:.95rem;opacity:.9}
.res:disabled{opacity:.3;cursor:not-allowed}
.yes{background:var(--green)}.no{background:var(--red)}
.warn{margin:14px 0 0;padding:10px 12px;border-radius:10px;background:#f6e2dd;color:#7a2418;font-size:.95rem;line-height:1.4}
.info{margin:14px 0 0;font-size:.95rem;color:#6b5f55;line-height:1.4}
.done{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.tag{background:#efe6d0;border-radius:20px;padding:4px 10px;font-size:.9rem;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid #d9cfba;font-size:1.05rem}
.row:last-child{border:0}
.row small{color:#6b5f55}
.pts{font-weight:800;font-size:1.2rem}.pts.z{color:var(--red)}.pts.p{color:var(--green)}
details{margin-top:18px;color:var(--muted)}
summary{cursor:pointer;font-weight:700;padding:6px 0}
.wrap{overflow-x:auto;background:var(--card);border-radius:12px;margin-top:8px}
table{border-collapse:collapse;color:var(--ink);width:100%;min-width:max-content;font-size:.95rem}
th,td{border:1px solid #3b332d;padding:6px 8px;text-align:center}
th{background:#efe6d0}
</style>
</head>
<body>
<main>
<section id="reg">
  <h1>Kachuful</h1>
  <p class="sub">Add everyone who is playing, then start the game.</p>
  <div class="add">
    <input id="n" type="text" maxlength="24" placeholder="Player name" autocomplete="off" aria-label="Player name">
    <button class="btn" id="add">Add player</button>
  </div>
  <div class="msg" id="msg" role="status"></div>
  <div class="bar"><b id="count">0 players</b><div class="hint" id="hint"></div></div>
  <ul id="list"></ul>
  <div class="actions">
    <button class="ghost" id="shuffle" disabled>Shuffle seating</button>
    <button class="ghost" id="clear" disabled>Clear all</button>
  </div>
  <button class="btn big" id="start" disabled>Start game</button>
</section>
<section id="game" hidden>
  <div class="board"><div class="brow"><div class="lbl">Current score</div><button class="sar" id="sar" aria-label="Sar, the trump suit. Tap to change"><i id="sarS">♠</i><span>Sar<em>trump · tap to change</em></span></button></div><div class="chips" id="board"></div></div>
  <div class="top"><div class="rd" id="rd"></div><div class="meta" id="meta"></div></div>
  <div id="panel"></div>
  <div class="actions">
    <button class="ghost" id="undo">Undo</button>
    <button class="ghost" id="end">End game</button>
  </div>
  <details><summary>Round history</summary><div class="wrap" id="hist"></div></details>
</section>
</main>
<script>
(function(){
var KEY="kachuful:players",GKEY="kachuful:game",MAXP=8,DECK=52,suits=["♠","♥","♣","♦"];
var players=[],g=null,lastTap=0;
function maxCards(n){return Math.min(8,Math.floor(DECK/n))}
function mkRounds(n){var m=maxCards(n),r=[],i;for(i=1;i<=m;i++)r.push(i);for(i=m-1;i>=1;i--)r.push(i);return r}
try{var s=localStorage.getItem(KEY);if(s){var p=JSON.parse(s);if(Array.isArray(p))players=p.filter(function(x){return typeof x==="string"}).slice(0,MAXP)}}catch(e){}
try{var t=localStorage.getItem(GKEY);if(t){var q=JSON.parse(t);
  if(q&&Array.isArray(q.names)&&q.names.length>=2&&q.names.length<=MAXP&&Array.isArray(q.hist)){
    g=q;g.rounds=mkRounds(g.names.length);
    if(typeof g.r!=="number"||g.r>=g.rounds.length){g.r=g.rounds.length-1;g.phase="done"}
    g.tr=g.tr||{};g.bids=g.bids||[];g.res=g.res||[];g.i=g.i||0}}}catch(e){g=null}
var $=function(id){return document.getElementById(id)};
var input=$("n"),msg=$("msg"),list=$("list");
function save(){try{localStorage.setItem(KEY,JSON.stringify(players));localStorage.setItem(GKEY,JSON.stringify(g))}catch(e){}}
function say(x){msg.textContent=x||""}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function tap(){var n=Date.now();if(n-lastTap<350)return false;lastTap=n;return true}
function twoTap(btn,action){var orig=btn.textContent,armed=false,tm;btn.onclick=function(){if(!armed){armed=true;btn.textContent="Tap again to confirm";tm=setTimeout(function(){armed=false;btn.textContent=orig},3000);return}clearTimeout(tm);armed=false;btn.textContent=orig;action()}}

/* ---------- registration ---------- */
function renderReg(){
  list.innerHTML="";
  if(!players.length){var d=document.createElement("div");d.className="empty";d.textContent="No players yet. Type a name above and press Add player.";list.appendChild(d)}
  players.forEach(function(name,i){
    var li=document.createElement("li"),su=suits[i%4];
    li.innerHTML='<span class="suit'+(i%4===1||i%4===3?' red':'')+'">'+su+'</span><span class="name"></span><span class="seat">Seat '+(i+1)+'</span><button class="x"></button>';
    li.querySelector(".name").textContent=name;
    var x=li.querySelector(".x");x.textContent="×";x.setAttribute("aria-label","Remove "+name);
    x.onclick=function(){players.splice(i,1);save();say("");renderReg()};
    list.appendChild(li);
  });
  var n=players.length,mc=n?maxCards(n):0;
  $("count").textContent=n+(n===1?" player":" players");
  $("hint").textContent=n>=2?"52-card deck: rounds go from 1 up to "+mc+" cards each and back to 1 ("+n+" × "+mc+" = "+(n*mc)+" cards dealt at most).":"Add at least 2 players (up to "+MAXP+").";
  $("shuffle").disabled=n<2;$("clear").disabled=!n;$("start").disabled=n<2;
}
function add(){
  var v=input.value.replace(/\s+/g," ").trim();
  if(!v){say("Enter a name to add a player.");return}
  if(players.some(function(p){return p.toLowerCase()===v.toLowerCase()})){say(v+" is already registered. Use a different name.");return}
  if(players.length>=MAXP){say("The table is full at "+MAXP+" players. Remove someone to add another.");return}
  players.push(v);save();input.value="";say("");renderReg();input.focus();
}
$("add").onclick=add;
input.addEventListener("keydown",function(e){if(e.key==="Enter")add()});
$("shuffle").onclick=function(){for(var i=players.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=players[i];players[i]=players[j];players[j]=t}save();say("Seating shuffled.");renderReg()};
twoTap($("clear"),function(){players=[];save();say("");renderReg()});
function newGame(names){g={names:names.slice(),rounds:mkRounds(names.length),tr:{},r:0,phase:"bid",i:0,bids:[],res:[],hist:[]};save();show()}
$("start").onclick=function(){if(players.length>=2)newGame(players)};

/* ---------- game ---------- */
var TORDER=[0,3,2,1];
function trumpIdx(){return g.tr&&g.tr[g.r]!=null?g.tr[g.r]:TORDER[g.r%4]}
function n(){return g.names.length}
function dealer(){return g.r%n()}
function order(){var o=[],d=dealer();for(var k=1;k<=n();k++)o.push((d+k)%n());return o}
function total(pi){return g.hist.reduce(function(a,h){return a+h.pts[pi]},0)}
function feas(R,bs){if(!bs.length)return R===0;var b=bs[0],rest=bs.slice(1);for(var x=0;x<=R;x++){if(x!==b&&feas(R-x,rest))return true}return false}
function show(){$("reg").hidden=!!g;$("game").hidden=!g;if(g)renderGame();else renderReg();window.scrollTo(0,0)}
function renderGame(){
  var N=n(),cd=g.rounds[g.r],ts=g.names.map(function(_,i){return total(i)}),mx=Math.max.apply(null,ts),over=g.phase==="done";
  $("rd").textContent=over?"Final result":"Round "+(g.r+1)+" of "+g.rounds.length;
  $("meta").innerHTML=over?"":cd+(cd===1?" card":" cards")+" each<br>Dealer: "+esc(g.names[dealer()]);
  $("board").innerHTML=g.names.map(function(nm,i){return '<div class="chip'+(mx>0&&ts[i]===mx?' lead':'')+'"><span>'+esc(nm)+'</span><b>'+ts[i]+'</b></div>'}).join("");
  var ti=trumpIdx();$("sarS").textContent=suits[ti];$("sarS").className=(ti===1||ti===3)?"red":"";$("sar").hidden=over;
  var P=$("panel"),o=order(),h="";
  if(g.phase==="bid"){
    var pi=o[g.i],mb=Math.min(5,cd),isD=(g.i===N-1),vals=[],v;
    var sum=o.slice(0,g.i).reduce(function(a,k){return a+g.bids[k]},0),bad=isD?cd-sum:-1;
    for(v=0;v<=mb;v++)vals.push(v);
    h='<div class="panel"><h2>'+esc(g.names[pi])+'</h2><p>How many hands will you win? '+(cd===1?'There is 1 card, so bid 0 or 1.':'With '+cd+' cards the highest bid is '+mb+'.')+(isD?' (dealer)':'')+'</p><div class="grid">'+
      vals.map(function(v){return '<button class="num" data-v="'+v+'"'+(v===bad?' disabled':'')+'>'+v+'</button>'}).join("")+'</div>'+
      '<div class="info">Bids so far: '+sum+' of '+cd+' cards.</div>'+
      (isD&&bad===0?'<div class="warn">The other bids already add up to '+cd+' cards, so the dealer must bid at least 1.</div>':(isD&&bad>0&&bad<=mb?'<div class="warn">Dealer cannot bid '+bad+'. All bids would add up to '+cd+', so nobody could lose.</div>':''))+
      '<div class="done">'+o.slice(0,g.i).map(function(k){return '<span class="tag">'+esc(g.names[k])+': '+g.bids[k]+'</span>'}).join("")+'</div></div>';
    P.innerHTML=h;
    P.querySelectorAll(".num").forEach(function(b){b.onclick=function(){
      if(b.disabled||!tap())return;
      g.bids[pi]=+b.dataset.v;g.i++;if(g.i>=N){g.phase="result";g.i=0}save();renderGame()}});
  }else if(g.phase==="result"){
    var pj=o[g.i],bj=g.bids[pj],isL=(g.i===N-1),G=0,missed=[];
    o.slice(0,g.i).forEach(function(k){if(g.res[k])G+=g.bids[k];else missed.push(g.bids[k])});
    var ok=function(got){
      var G2=G+(got?bj:0),m=missed.slice();if(!got)m.push(bj);
      if(G2>cd)return false;
      return isL?feas(cd-G2,m):true};
    var yOk=ok(true),nOk=ok(false),why="";
    if(!yOk&&!nOk)why="Earlier answers do not add up to "+cd+" hands. Press Undo and check them.";
    else if(!yOk)why=G+bj>cd?"Got it is not possible: winners would hold more than "+cd+" hands.":"Got it is not possible: the hands would not add up to "+cd+".";
    else if(!nOk)why="Missed is not possible: the hands would not add up to "+cd+".";
    h='<div class="panel"><h2>'+esc(g.names[pj])+'</h2><p>Chose '+bj+'. Did they win exactly '+bj+' '+(bj===1?'hand':'hands')+'?</p><div class="two">'+
      '<button class="res yes" id="yes"'+(yOk?'':' disabled')+'>Got it<small>+'+(10+bj)+'</small></button><button class="res no" id="no"'+(nOk?'':' disabled')+'>Missed<small>0</small></button></div>'+
      '<div class="info">Cards this round: '+cd+'. Hands held by players who got it: '+G+'.</div>'+(why?'<div class="warn">'+why+'</div>':'')+'</div>';
    P.innerHTML=h;
    var fin=function(val){
      if(!tap())return;
      g.res[pj]=val;g.i++;
      if(g.i>=N){g.hist.push({cards:cd,bids:g.bids.slice(),pts:g.names.map(function(_,k){return g.res[k]?10+g.bids[k]:0})});g.phase="summary"}
      save();renderGame()};
    $("yes").onclick=function(){if(yOk)fin(true)};$("no").onclick=function(){if(nOk)fin(false)};
  }else if(g.phase==="summary"){
    var hr=g.hist[g.hist.length-1],last=g.r>=g.rounds.length-1;
    h='<div class="panel"><h2>Round '+(g.r+1)+' scores</h2><p>'+hr.cards+(hr.cards===1?' card':' cards')+' each</p>'+
      g.names.map(function(nm,i){return '<div class="row"><span>'+esc(nm)+' <small>chose '+hr.bids[i]+'</small></span><span class="pts '+(hr.pts[i]?'p':'z')+'">'+(hr.pts[i]?'+':'')+hr.pts[i]+'</span></div>'}).join("")+
      '</div><button class="btn big" id="next">'+(last?'See final result':'Next round')+'</button>';
    P.innerHTML=h;
    $("next").onclick=function(){if(!tap())return;if(last){g.phase="done"}else{g.r++;g.phase="bid";g.i=0;g.bids=[];g.res=[]}save();renderGame();window.scrollTo(0,0)};
  }else{
    var ranks=g.names.map(function(nm,i){return{nm:nm,t:ts[i]}}).sort(function(a,b){return b.t-a.t});
    var tops=ranks.filter(function(x){return x.t===ranks[0].t}).map(function(x){return x.nm});
    h='<div class="panel"><h2>'+(tops.length>1?esc(tops.join(" & "))+' tie':esc(tops[0])+' wins')+'</h2><p>Final standings</p>'+
      ranks.map(function(x,i){return '<div class="row"><span>'+(i+1)+'. '+esc(x.nm)+'</span><span class="pts">'+x.t+'</span></div>'}).join("")+'</div>'+
      '<button class="btn big" id="again">Play again with same players</button>';
    P.innerHTML=h;
    $("again").onclick=function(){newGame(g.names)};
  }
  $("undo").disabled=(g.phase==="bid"&&g.i===0&&g.r===0);
  $("hist").innerHTML=g.hist.length?'<table><tr><th>Cards</th>'+g.names.map(function(x){return '<th>'+esc(x)+'</th>'}).join("")+'</tr>'+
    g.hist.map(function(r){return '<tr><td><b>'+r.cards+'</b></td>'+r.pts.map(function(p,i){return '<td>'+r.bids[i]+' → '+p+'</td>'}).join("")+'</tr>'}).join("")+'</table>':'<p class="hint" style="padding:10px">No rounds finished yet.</p>';
}
$("undo").onclick=function(){
  if(!g)return;
  if(g.phase==="bid"){
    if(g.i>0)g.i--;
    else if(g.r>0){var h=g.hist[g.hist.length-1];g.r--;g.phase="summary";g.bids=h.bids.slice();g.res=h.pts.map(function(p){return p>0})}
  }else if(g.phase==="result"){if(g.i>0)g.i--;else{g.phase="bid";g.i=n()-1}}
  else if(g.phase==="summary"){g.hist.pop();g.phase="result";g.i=n()-1}
  else if(g.phase==="done"){g.phase="summary"}
  save();renderGame();
};
$("sar").onclick=function(){if(!g||g.phase==="done")return;g.tr[g.r]=(trumpIdx()+1)%4;save();renderGame()};
twoTap($("end"),function(){g=null;save();show()});
show();
})();
</script>
</body>
</html>
